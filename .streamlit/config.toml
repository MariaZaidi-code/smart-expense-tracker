[theme]
base = "dark"
primaryColor = "#2F6BFF"
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EAF2"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
